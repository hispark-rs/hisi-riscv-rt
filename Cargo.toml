[package]
name = "ws63-rt"
version = "0.2.0"
edition = "2024"
description = "Runtime support for HiSilicon WS63 (RISC-V RV32IMFC_Zicsr) — startup, interrupt vectors, linker script"
license = "MIT"
repository = "https://github.com/sanchuanhehe/ws63-rt"
keywords = ["ws63", "hisilicon", "riscv", "embedded", "runtime"]
categories = ["embedded", "no-std", "hardware-support"]

[dependencies]
# ws63-rt owns the single application hart, so it registers the global
# critical-section impl for the whole firmware. This impl backs both
# ws63-pac's `Peripherals::take()` and ws63-hal's portable-atomic polyfill
# (the WS63 core has no atomic extension). Exactly one crate must enable this.
riscv = { version = "0.13", features = ["critical-section-single-hart"] }
riscv-rt = "0.14"
# The active chip's PAC (exactly one, selected by the chip feature) — re-exported
# for the interrupt enum; its device.x (emitted under chip-ws63 here, or by the
# PAC's own rt feature for BS21) drives the riscv-rt vector table. path = monorepo,
# version = `cargo publish`.
ws63-pac = { version = "0.1", path = "../ws63-pac", optional = true }
bs21-pac = { version = "0.1", path = "../bs21-pac", optional = true }
critical-section = "1"

[features]
# bundled-memory-x (default ON) + chip-ws63 (default): ws63-rt ships the WS63
# memory.x + the WS63 device.x. A binary with its OWN memory layout sets
# `default-features = false` (turning both off) and must re-select its chip, e.g.
# `features = ["chip-ws63"]` (own memory.x) or `["chip-bs21"]` (BS21). Keeping
# exactly one memory.x on the search path makes ws63-link.x's `INCLUDE memory.x`
# deterministic.
default = ["bundled-memory-x", "chip-ws63"]
bundled-memory-x = []
chip-ws63 = ["dep:ws63-pac"]
chip-bs21 = ["dep:bs21-pac"]

[build-dependencies]

[profile.release]
opt-level = "s"
lto = true
debug = true

[profile.dev]
opt-level = "s"
