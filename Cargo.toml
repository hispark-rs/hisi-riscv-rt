[package]
name = "ws63-rt"
version = "0.2.0"
edition = "2024"
description = "Runtime support for HiSilicon WS63 (RISC-V RV32IMFC_Zicsr) — startup, interrupt vectors, linker script"
license = "MIT"
repository = "https://github.com/sanchuanhehe/ws63-rt"
keywords = ["ws63", "hisilicon", "riscv", "embedded", "runtime"]
categories = ["embedded", "no-std", "hardware-support"]

[dependencies]
# ws63-rt owns the single application hart, so it registers the global
# critical-section impl for the whole firmware. This impl backs both
# ws63-pac's `Peripherals::take()` and ws63-hal's portable-atomic polyfill
# (the WS63 core has no atomic extension). Exactly one crate must enable this.
riscv = { version = "0.13", features = ["critical-section-single-hart"] }
riscv-rt = "0.14"
# version + path: `path` is used for local/monorepo builds, `version` is required
# for `cargo publish`. In the monorepo, the root [patch.crates-io] keeps this and
# ws63-hal's registry dep resolved to the single local ws63-pac instance.
ws63-pac = { version = "0.1", path = "../ws63-pac" }
critical-section = "1"

[features]
# `bundled-memory-x` (default ON): ws63-rt ships a correct WS63 memory.x and puts
# it on the linker search path, so downstream binaries link with zero config.
# A binary that needs its OWN memory layout sets `default-features = false` on
# ws63-rt and supplies its own memory.x (copy it to OUT_DIR + rustc-link-search in
# its build.rs — see ws63-examples/custom_memory). That keeps exactly ONE memory.x
# on the search path, so ws63-link.x's `INCLUDE memory.x` resolves deterministically
# (no two-memory.x / link-order ambiguity, no MEMORY-region-redefined conflict).
default = ["bundled-memory-x"]
bundled-memory-x = []

[build-dependencies]

[profile.release]
opt-level = "s"
lto = true
debug = true

[profile.dev]
opt-level = "s"
