[package]
name = "hisi-riscv-rt"
version = "0.5.0"
edition = "2024"
description = "Runtime support for HiSilicon RISC-V chips — entry, startup adapters, interrupt vectors, linker scripts"
license = "MIT"
repository = "https://github.com/hispark-rs/hisi-riscv-rt"
keywords = ["ws63", "hisilicon", "riscv", "embedded", "runtime"]
categories = ["embedded", "no-std", "hardware-support"]

[dependencies]
# hisi-riscv-rt owns the single application hart, so it registers the global
# critical-section impl for the whole firmware. This impl backs both
# ws63-pac's `Peripherals::take()` and hisi-riscv-hal's portable-atomic polyfill
# (the WS63 core has no atomic extension). Exactly one crate must enable this.
riscv = { version = "0.13", features = ["critical-section-single-hart"] }
riscv-rt = "0.14"
# The active chip's PAC (exactly one, selected by the chip feature) is re-exported
# for the interrupt enum and owns that chip's `device.x` through its `rt` feature.
# Standalone consumers, CI, and publish resolve these from crates.io; the parent
# workspace redirects them to local submodules through [patch.crates-io] during
# development.
ws63-pac = { version = "0.2", optional = true }
bs2x-pac = { version = "0.1", optional = true }
critical-section = "1"

[features]
# NO default chip (esp-hal style, mirroring hisi-riscv-hal 0.5.0). The public crate
# interface is chip-neutral, but startup/linker resources are selected by chip
# adapters. `bundled-memory-x` emits the active chip's default memory.x:
# WS63 for `chip-ws63`, BS21/BS2X 160K L2RAM for `chip-bs21`. BS20 binaries and
# custom boards should disable it and provide their own memory.x. Downstream bins
# should link with `-Thisi-riscv-link.x`.
default = ["bundled-memory-x"]
bundled-memory-x = []
chip-ws63 = ["dep:ws63-pac", "ws63-pac/rt"]
chip-bs21 = ["dep:bs2x-pac", "bs2x-pac/rt"]
unstable = []
# boot-header (default OFF): bake the 0x300-byte WS63 HiSilicon image header into
# the ELF at flash 0x230000, immediately before .startup at 0x230300, so the bare
# ELF is directly bootable by flashboot after a post-link `hisi-fwpkg patch-hash`
# (fills the body SHA-256) — no separate `hisi-fwpkg image` step, then
# `probe-rs download` / `probe-rs run`. The default build is byte-unchanged: the
# header section + its placement are only emitted/INCLUDEd when this feature is on,
# so QEMU/`-kernel` users are undisturbed. WS63 only.
boot-header = []
# Reserved opt-in for the next startup experiment: let riscv-rt own the generic
# `_start` work while the WS63 adapter keeps chip-specific trap/cache/header setup.
# It is intentionally non-default and additionally requires `unstable` until
# QEMU + HIL prove the path.
riscv-rt-start-experiment = []

[build-dependencies]
