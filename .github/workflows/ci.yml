name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TARGET: riscv32imfc-unknown-none-elf
  TOOLCHAIN: nightly-2026-07-09

jobs:
  # hisi-riscv-rt is riscv-only: it `global_asm!`s the riscv startup and pulls the
  # riscv crate. Standalone CI deliberately resolves PAC dependencies from
  # crates.io; local monorepo development uses the parent workspace's
  # [patch.crates-io] instead. The target is now an upstream rustc builtin in the
  # pinned nightly, but rustup does not ship a prebuilt rust-std component for it
  # yet, so RISC-V commands pass `-Zbuild-std=core,alloc`.
  check:
    name: Check + Clippy + Docs (riscv32imfc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$TOOLCHAIN" \
            --profile minimal \
            --component rust-src \
            --component clippy \
            --component rustfmt
          rustc +"$TOOLCHAIN" --version
          rustc +"$TOOLCHAIN" --print target-list | grep -qx "$TARGET"
      - name: Check
        run: |
          cargo +"$TOOLCHAIN" check -Zbuild-std=core,alloc --locked --target "$TARGET" \
            --no-default-features --features chip-ws63,boot-header
          cargo +"$TOOLCHAIN" check -Zbuild-std=core,alloc --locked --target "$TARGET" \
            --no-default-features --features chip-bs21,unstable
      - name: Clippy
        run: |
          cargo +"$TOOLCHAIN" clippy -Zbuild-std=core,alloc --locked --target "$TARGET" \
            --no-default-features --features chip-ws63,boot-header -- -D warnings
          cargo +"$TOOLCHAIN" clippy -Zbuild-std=core,alloc --locked --target "$TARGET" \
            --no-default-features --features chip-bs21,unstable -- -D warnings
      - name: Docs
        run: cargo +"$TOOLCHAIN" doc -Zbuild-std=core,alloc --locked --no-deps --document-private-items --target "$TARGET"
        env:
          RUSTDOCFLAGS: -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
